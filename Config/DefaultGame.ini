+TitleCaptions=(Start=0.0,End=7.1,Text="In the year 2031, the National Assembly of the Republic of Korea passed the Civil Courtesy and Self-Protection Act.")
+TitleCaptions=(Start=7.1,End=10.0,Text="It was bill number 212 of the night.")
+TitleCaptions=(Start=10.0,End=16.5,Text="It passed at 3:14 a.m., with 91 percent approval, and no one could later remember reading it.")
+TitleCaptions=(Start=16.5,End=18.1,Text="The reasoning was simple.")
+TitleCaptions=(Start=18.1,End=19.5,Text="People were tired.")
+TitleCaptions=(Start=19.5,End=21.0,Text="Tired of waiting.")
+TitleCaptions=(Start=21.0,End=23.6,Text="Tired of noise from the floor above.")
+TitleCaptions=(Start=23.6,End=27.1,Text="Tired of the car blocking the exit, again.")
+TitleCaptions=(Start=27.1,End=31.9,Text="Experts agreed: a nation that is armed is a nation that is polite.")
+TitleCaptions=(Start=31.9,End=35.0,Text="Within a week, every citizen had the right to carry.")
+TitleCaptions=(Start=35.0,End=38.9,Text="Within a month, everyone was very, very polite.")
+TitleCaptions=(Start=38.9,End=43.3,Text="When reporters asked who had written the law, the ministry said it was the Assembly.")
+TitleCaptions=(Start=43.3,End=45.5,Text="The Assembly said it was the committee.")
+TitleCaptions=(Start=45.5,End=47.9,Text="The committee said it was the ministry.")
+TitleCaptions=(Start=47.9,End=50.9,Text="Everyone was simply passing along the message.")
+TitleCaptions=(Start=50.9,End=52.3,Text="This is Seoul.")
+TitleCaptions=(Start=52.3,End=54.5,Text="Have a pleasant day.")
